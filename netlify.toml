[build]
  command = "node build.mjs || echo 'build.mjs selhal — nasazuji web bez generovaných stránek'"
  publish = "."
  functions = "netlify/functions"

# Fotky se nikdy nepřepisují (admin nové nahrává pod novým názvem), proto je lze cachovat déle
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
