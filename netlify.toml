[build]
  command = "node build.mjs || echo 'build.mjs selhal — nasazuji web bez generovaných stránek'"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
